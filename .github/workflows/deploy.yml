name: Deploy Agentic AI Governance on OCI

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'terraform/**'
      - 'policies/**'
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate JSON files
        run: |
          for file in policies/**/*.json audit-framework/*.json; do
            if [ -f "$file" ]; then
              echo "Validating $file"
              jq empty "$file" || exit 1
            fi
          done

      - name: Validate Python syntax
        run: |
          for file in src/**/*.py; do
            if [ -f "$file" ]; then
              echo "Validating $file"
              python -m py_compile "$file" || exit 1
            fi
          done

      - name: Validate Terraform
        run: |
          cd terraform
          terraform fmt -check
          terraform init -backend=false

      - name: Check required artifacts
        run: |
          REQUIRED_FILES=(
            "terraform/main.tf"
            "src/policy-engine/func.py"
            "src/remediator/func.py"
            "policies/iam/agent-iam-policies.tf"
            "policies/guardrails/guardrails-config.json"
            "policies/zpr/zpr-policies.tf"
            "audit-framework/agentic-ai-governance-framework.json"
          )
          for file in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$file" ]; then
              echo "❌ Missing required file: $file"
              exit 1
            fi
          done
          echo "✅ All required artifacts are present"

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0

      - name: Configure OCI CLI
        run: |
          mkdir -p ~/.oci
          echo "${{ secrets.OCI_CONFIG }}" > ~/.oci/config

      - name: Deploy Terraform infrastructure
        run: |
          cd terraform
          terraform init
          terraform apply -auto-approve \
            -var="tenancy_ocid=${{ secrets.OCI_TENANCY_OCID }}" \
            -var="region=${{ secrets.OCI_REGION }}" \
            -var="object_storage_namespace=${{ secrets.OCI_NAMESPACE }}" \
            -var="notification_email=${{ secrets.NOTIFICATION_EMAIL }}"
